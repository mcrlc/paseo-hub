# ac-7rt scenario 2: one refresh tick must land inside the execution, so idle_timeout is 7m
# (> the 5 min tick) and max_runtime is one minute above it. Bootstrap is ac-52w's verbatim:
# it installs Claude Code before the daemon starts (5.6) and makes an empty git repo as cwd.
# The environment has no Claude credential, so the run ends step_idle_timeout; that is the
# intended terminal here. Continuation key is rotated per scenario so each run gets a fresh agent.
name: qa-ac7rt-sprite
enabled: true
on:
  manual.run: {}
run:
  target:
    kind: sprite
    bootstrap: |
      npm install -g @anthropic-ai/claude-code && node "$(npm prefix -g)/lib/node_modules/@anthropic-ai/claude-code/install.cjs"
      mkdir -p /home/sprite/workspace/project && cd /home/sprite/workspace/project && git init -q && git -c user.email=qa@example.com -c user.name=qa commit -q --allow-empty -m init
    cwd: /home/sprite/workspace/project
  agent: { provider: claude, mode: bypassPermissions }
  continuation:
    mode: key
    key: qa-ac7rt-s2
  prompt: Call the finish_execution MCP tool exactly once. Do not use curl, shell, or direct HTTP.
  auto_archive: true
  max_runtime: 8m
  idle_timeout: 7m
